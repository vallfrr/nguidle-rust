[package]
name = "clr"
version = "0.1.0"
edition = "2021"

[lib]
name = "clr"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "clr"
path = "src/main.rs"

[dependencies]
cil-interp = { path = "../crates/cil-interp" }
save-format = { path = "../crates/save-format" }
platform-api = { path = "../crates/platform-api" }
dotnetdll = "0.5"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
png = "0.17"
fontdue = "0.9"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"

