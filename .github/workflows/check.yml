name: Checks

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGU_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
      - name: Install check tools
        run: |
          python -m pip install ruff==0.11.13
          cargo +1.100.0 install --locked --version 1.43.0 just
      - name: Run the local checks
        run: just check
      - name: Compare synthetic IL fixtures with .NET
        run: just verify-fixtures
